<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4EEE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0D0A" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>saakshe — signing you in…</title>
<meta name="description" content="Completing your saakshe sign-in — verifying your session with Supabase, then taking you to the cockpit.">
<!-- no-flash theme: saved 'saakshe-theme' → OS preference → light (site default) -->
<script>
(function(){
  try{
    var t=localStorage.getItem('saakshe-theme');
    if(t!=='dark'&&t!=='light'){
      t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    }
    document.documentElement.setAttribute('data-theme',t);
  }catch(e){document.documentElement.setAttribute('data-theme','light');}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* saakshe tokens — BRUT (light) defaults, OBSIDIAN (dark) overrides */
  :root{
    color-scheme: light dark;
    --paper:#F4EEE2; --ink:#161410; --ink-2:#45413A;
    --ok:#3E8F5E;    /* kural green (light) */
    --err:#CC4632;   /* kalai red (light) */
  }
  html[data-theme="dark"]{
    --paper:#0A0D0A; --ink:#D4F5DE; --ink-2:#9DBBA6;
    --ok:#5EF08A;    /* phosphor green (dark) */
    --err:#E0685C;   /* kalai red (dark) */
  }
  html,body{ height:100%; margin:0; }
  body{ display:grid; place-items:center; font-family:"Space Grotesk",system-ui,sans-serif;
        background:var(--paper); color:var(--ink); }
  .brand{ font-weight:700; font-size:15px; letter-spacing:.34em; color:var(--ink);
          margin-bottom:22px; user-select:none; }
  .card{ text-align:center; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--ok); display:inline-block;
        margin-right:8px; animation:p 1s ease-in-out infinite; }
  .dot.err{ background:var(--err); animation:none; }
  @keyframes p{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
  .mono{ font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; color:var(--ink-2);
         margin-top:10px; }
  a{ color:inherit; }
</style>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <div class="brand" aria-label="saakshe">SΛΛKSHE</div>
    <div><span class="dot" id="dot"></span><strong id="msg">completing sign-in…</strong></div>
    <div class="mono" id="sub">verifying your session with Supabase</div>
  </div>
  <script type="module">
    // Completes the Supabase OAuth round-trip: supabase-js parses the URL fragment
    // (detectSessionInUrl), persists the session, then we bounce to the cockpit —
    // restoring the deep link the cockpit passed through as ?next=#….
    function dest(){
      try{
        const next = new URLSearchParams(location.search).get("next");
        if(next && next.charAt(0)==="#"){ return "/cockpit.html"+next; }
      }catch(e){}
      return "/cockpit.html";
    }
    function oauthError(){
      // Providers report failure in either the query or the fragment — read both.
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ""));
      const err = q.get("error") || h.get("error");
      if(!err) return null;
      return q.get("error_description") || h.get("error_description") || err;
    }
    async function go(){
      const denied = oauthError();
      if(denied){ return fail(denied); }
      try{
        const r = await fetch("/api/public-config", {cache:"no-store"});
        if(!r.ok){ throw new Error("public-config responded " + r.status); }
        const cfg = await r.json();
        if(!cfg.supabase_url || !cfg.anon_key){ return fail("auth is not configured"); }
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
        const sb = createClient(cfg.supabase_url, cfg.anon_key, {
          auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
        // Give detectSessionInUrl a tick to consume the fragment, then confirm.
        const { data } = await sb.auth.getSession();
        if(data && data.session){
          document.getElementById("msg").textContent = "signed in ✓";
          document.getElementById("sub").textContent = "taking you to the cockpit…";
          location.replace(dest());
        } else {
          // Some flows resolve slightly later — listen once, then decide explicitly.
          let done = false;
          sb.auth.onAuthStateChange((_e, s)=>{ if(s && !done){ done = true; location.replace(dest()); } });
          setTimeout(async ()=>{
            if(done) return;
            // Last look before giving up: the session may have landed without an event.
            try{
              const again = await sb.auth.getSession();
              if(!done && again && again.data && again.data.session){
                done = true;
                return location.replace(dest());
              }
            }catch(e){ console.error(e); }
            if(done) return;
            done = true;
            // No session materialized: an auto-redirect here would silently loop
            // the founder back to the gate — say what happened instead.
            fail("no session arrived from the provider");
          }, 8000);
        }
      }catch(e){
        console.error(e);
        fail("couldn't reach saakshe — check your connection and try again");
      }
    }
    function fail(m){
      document.getElementById("dot").classList.add("err");
      document.getElementById("msg").textContent = "sign-in could not complete";
      document.getElementById("sub").innerHTML = String(m).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
        + ' — <a href="/cockpit.html">try signing in again</a>';
    }
    go();
  </script>
</body>
</html>

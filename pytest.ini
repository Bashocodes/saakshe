[pytest]
pythonpath = .
# A bare `pytest` runs ONLY the root suite: the realm packages (common/ manas/
# kalai/ kural/ arivu/) each ship a nested tests/ that collides with this one on
# the `tests` module name in a single session. The FULL gate runs each suite in
# its own process — see scripts/test_all.sh (invoked by deploy_cloudrun.sh).
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning

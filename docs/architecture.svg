  <!-- manas -> arivu (doubles as flywheel step 1: grounds) -->
  <line x1="250" y1="394" x2="520" y2="498" stroke="#111111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="255" y="470" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="start">&#9312; grounds</text>


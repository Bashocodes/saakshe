  <rect x="985" y="265" width="300" height="130" fill="#111111"/>
  <rect x="980" y="260" width="300" height="130" fill="#F4EEE2" stroke="#111111" stroke-width="3"/>
  <rect x="1083" y="288" width="26" height="26" fill="#4e8f78" stroke="#111111" stroke-width="2"/>

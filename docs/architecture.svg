  <rect x="870" y="177" width="150" height="36" fill="#111111"/>
  <rect x="865" y="172" width="150" height="36" fill="#C8341F" stroke="#111111" stroke-width="2"/>
  <text x="940" y="195" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F4EEE2" text-anchor="middle">TAP 2 &#183; HUMAN</text>


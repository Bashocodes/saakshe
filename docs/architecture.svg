  <text x="250" y="345" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">knows &#183; cited, versioned memory</text>
  <text x="250" y="368" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">refuses out-of-corpus</text>


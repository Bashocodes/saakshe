  <text x="1130" y="345" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">engages &#183; carries verbatim</text>
  <text x="1130" y="368" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">authors nothing (no text field)</text>


  <text x="915" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle">&#9314; cleared</text>
  <text x="915" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">verbatim</text>


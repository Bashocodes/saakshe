    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="900" fill="#F4EEE2"/>

  <!-- ======================= TOP BAND ======================= -->
  <!-- founder box -->
  <rect x="85" y="50" width="300" height="100" fill="#111111"/>
  <rect x="80" y="45" width="300" height="100" fill="#F4EEE2" stroke="#111111" stroke-width="3"/>
  <text x="230" y="92" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">THE FOUNDER</text>
  <text x="230" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">two taps a day — approves both gates</text>

  <!-- founder <-> saakshe -->
  <line x1="384" y1="95" x2="536" y2="95" stroke="#111111" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="460" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">chat + voice</text>

  <!-- saakshe box -->
  <rect x="545" y="50" width="780" height="100" fill="#111111"/>
  <rect x="540" y="45" width="780" height="100" fill="#F4EEE2" stroke="#111111" stroke-width="3"/>
  <text x="930" y="92" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#111111" text-anchor="middle">SAAKSHE — the witness</text>
  <text x="930" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">tools-over-telemetry &#183; refuses beyond its data &#183; reads the event stream behind every span</text>

  <!-- ======================= FLYWHEEL RETURN PATH (kural -> manas) ======================= -->
  <path d="M 1130 260 L 1130 190 L 260 190 L 260 258" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1144" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="start">&#9315; publish</text>
  <text x="274" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="start">&#9316; learns &#183; pack v+1</text>


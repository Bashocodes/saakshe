  <rect x="540" y="432" width="150" height="36" fill="#111111"/>
  <rect x="535" y="427" width="150" height="36" fill="#C8341F" stroke="#111111" stroke-width="2"/>
  <text x="610" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#F4EEE2" text-anchor="middle">TAP 1 &#183; HUMAN</text>

  <!-- ======================= ARIVU — SHARED DECISION CHAMBER ======================= -->
  <rect x="425" y="505" width="560" height="130" fill="#111111"/>
  <rect x="420" y="500" width="560" height="130" fill="#F4EEE2" stroke="#111111" stroke-width="3"/>
  <rect x="495" y="521" width="18" height="18" fill="#5a6fb0" stroke="#111111" stroke-width="2"/>
  <text x="525" y="537" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="start">arivu — the shared decision chamber</text>
  <text x="700" y="568" font-family="Menlo, monospace" font-size="14" fill="#111111" text-anchor="middle">frame &#8594; panel &#8594; debate &#8594; Claude verdict &#8594; prosecutor &#8594; gate</text>
  <text x="700" y="594" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">built once (common/chamber.py) &#183; panel &#8594; verify in every faculty</text>
  <text x="700" y="616" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">prosecutor revises only the faulted reason, never a full reset</text>

  <!-- executor note -->
  <text x="700" y="668" font-family="Menlo, monospace" font-size="14" fill="#111111" text-anchor="middle">executor: fires only after approval &#183; dry-run by default &#183; fail-soft ops, fail-closed gates</text>

  <!-- ======================= GOOGLE STACK STRIP ======================= -->
  <rect x="85" y="715" width="1240" height="80" fill="#111111"/>
  <rect x="80" y="710" width="1240" height="80" fill="#F4EEE2" stroke="#111111" stroke-width="3"/>
  <text x="700" y="742" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="middle" letter-spacing="3">GOOGLE STACK</text>
  <text x="700" y="772" font-family="Menlo, monospace" font-size="14" fill="#111111" text-anchor="middle">Cloud Run (saakshe.com) &#183; Vertex AI — Gemini 3.1 Pro (preview) / 3.5 Flash &#183; Claude Sonnet 4.6 via Model Garden &#183; ADK &#183; Imagen / Veo &#183; OTel</text>

  <!-- ======================= CAPTIONS ======================= -->
  <text x="80" y="845" font-family="Menlo, monospace" font-size="13" fill="#111111" text-anchor="start">saakshe — one founder, a whole company, one witness &#183; Track 1</text>
  <text x="1320" y="845" font-family="Menlo, monospace" font-size="13" fill="#111111" text-anchor="end">modes: demo (creds-free, byte-identical) &#183; hybrid &#183; live</text>

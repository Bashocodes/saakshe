  <line x1="610" y1="427" x2="610" y2="394" stroke="#111111" stroke-width="3" marker-end="url(#ah)"/>
  <text x="523" y="450" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#111111" text-anchor="end">&#9313; decide</text>


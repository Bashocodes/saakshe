  <rect x="550" y="260" width="300" height="130" fill="#F4EEE2" stroke="#111111" stroke-width="3"/>
  <polygon points="668,288 654,314 682,314" fill="#c06a5e" stroke="#111111" stroke-width="2"/>
  <text x="692" y="309" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111" text-anchor="start">kalai</text>
  <text x="700" y="345" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111111" text-anchor="middle">makes &#183; media + every word of copy</text>
  <text x="700" y="368" font-family="Menlo, monospace" font-size="14" fill="#111111" text-anchor="middle">Imagen / Veo &#183; brand vault</text>


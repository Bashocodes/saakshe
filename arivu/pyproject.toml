[project]
name = "arivu"
version = "0.1.0"
description = "arivu — the faculty of judgment. A multi-agent deliberation chamber on Google ADK: five grounded Gemini advisors argue, a Claude-via-Vertex chair synthesises a verdict, a Claude-via-Vertex prosecutor tries to defeat it, one human approval commits the change and dispatches A2A orders. Submitted to the Google for Startups AI Agents Challenge — Track 1 · Build."
authors = [{ name = "saakshe" }]
license = { text = "Apache License 2.0" }
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "google-adk>=1.31.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
    "google-genai>=1.9.0",
    "anthropic[vertex]>=0.49.0",
    "litellm>=1.0.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=1.31.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
deployment = [
    "absl-py>=2.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["arivu"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.agent-starter-pack]
example_question = "Should we raise our Pro subscription to $39?"

[tool.agent-starter-pack.settings]
agent_directory = "arivu"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

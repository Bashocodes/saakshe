[project]
name = "kalai"
version = "0.1.0"
description = "kalai — the studio that MAKES. A brand-fidelity multi-agent studio on Google ADK: a Claude-via-Vertex Creative Director frames the concept; a Designer/Producer and a Copy & SEO desk produce in parallel; a Gemini Brand-Fidelity scorer drives a deterministic climb-to-threshold loop; a Claude-via-Vertex fail-closed compliance gate clears the master; kalai hands the compliance-cleared multi-platform master to kural and never publishes. Part of saakshe — the agentic company — for the Google for Startups AI Agents Challenge."
authors = [{ name = "saakshe" }]
license = { text = "Apache License 2.0" }
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
    "google-adk>=1.31.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.93.0",
    "google-genai>=1.9.0",
    "anthropic[vertex]>=0.49.0",
    "litellm>=1.0.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=1.31.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
deployment = [
    "absl-py>=2.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["kalai"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.agent-starter-pack]
example_question = "Launch announcement for the decision: Raise Pro to $34, grandfather all existing subscribers, give 30-day notice."

[tool.agent-starter-pack.settings]
agent_directory = "kalai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
